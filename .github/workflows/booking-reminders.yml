# Daily booking reminders (5 and 2 days before). Free: GitHub Actions just calls the app's own endpoint,
# no Firebase Function or Cloud Scheduler. Needs repo secret CRON_SECRET = the same value as the App Hosting secret.
name: Booking reminders
on:
  schedule:
    - cron: "30 4 * * *" # 04:30 UTC = 10:00 IST. GitHub may start it a few minutes late.
  workflow_dispatch: # "Run workflow" button, for testing
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send due reminders
        run: |
          curl -fsS --retry 3 --retry-all-errors --max-time 120 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://dbhallbooking--hallbooking-8de43.asia-southeast1.hosted.app/api/cron/reminders
