name: Firebase deploy

on:
  push:
    branches: [main]

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Service account JSON key with Firebase deploy rights, stored as a repo secret.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - run: npx --yes firebase-tools@latest deploy --project hallbooking-8de43 --non-interactive
