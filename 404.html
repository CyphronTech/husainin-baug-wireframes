<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Husainin Baug</title>
<style>
  html,body{margin:0;height:100%;background:#F4F5F4;color:#1D2423;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box}
  .card{max-width:440px;width:100%;background:#FFFFFF;border:1px solid #E3E6E5;border-radius:12px;padding:32px 28px;text-align:center;box-shadow:0 8px 24px rgba(16,32,31,.08)}
  .mark{width:48px;height:48px;margin:0 auto 16px;border-radius:999px;background:#1F3B3A;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700}
  h1{font-size:20px;margin:0 0 8px}
  p{margin:0 0 24px;color:#4A5655;font-size:15px;line-height:1.5}
  a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:8px;background:#1F5F5B;color:#FFFFFF;font-weight:600;text-decoration:none}
  a.btn:hover{background:#123C39}
  .code{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#7A8684;margin-bottom:6px}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="mark" aria-hidden="true">HB</div>
    <div class="code">Error 404</div>
    <h1>This page could not be found</h1>
    <p>The link may be out of date. Head back to the Husainin Baug Hall &amp; Room Booking wireframe overview to see all screens.</p>
    <a class="btn" href="index.html">Back to overview</a>
  </div>
</main>
<script>
  // Served for unknown URLs at any depth: point the button at the site root when we can tell where it is.
  (function(){var p=location.pathname,i=p.indexOf("/screens/"),a=document.querySelector("a.btn");if(i>=0&&a)a.href=p.slice(0,i+1)+"index.html";})();
</script>
</body>
</html>
