# Firebase App Hosting (requires Blaze). Replace every CHANGE-ME, then create the two secrets:
#   firebase apphosting:secrets:set B2_KEY_ID
#   firebase apphosting:secrets:set B2_APP_KEY
# Razorpay and MSG91 WhatsApp are mocked while their variables are absent. To go live, add
# RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET and MSG91_AUTHKEY / MSG91_WA_NUMBER /
# MSG91_WA_NAMESPACE here (secret: for keys), as listed in .env.example.
env:
  - variable: APP_URL
    value: https://CHANGE-ME.hosted.app # App Hosting shows this URL after the first rollout
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: CHANGE-ME
  - variable: B2_KEY_ID
    secret: B2_KEY_ID
  - variable: B2_APP_KEY
    secret: B2_APP_KEY
  - variable: B2_BUCKET_ID
    value: CHANGE-ME
  - variable: B2_BUCKET_NAME
    value: CHANGE-ME
