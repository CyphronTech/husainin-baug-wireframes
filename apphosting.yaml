# Firebase App Hosting (needs the Blaze plan). Steps: README → "Deploy to Firebase App Hosting".
# Secrets (never in git):  firebase apphosting:secrets:set B2_KEY_ID   and   B2_APP_KEY
# Razorpay and MSG91 stay mocked while their variables are absent. To go live, add RAZORPAY_KEY_ID /
# RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET and MSG91_* here (keys as `secret:`), as listed in .env.example.
runConfig:
  minInstances: 0 # scales to zero when idle (free); first visit after idle takes a few seconds. 1 = always warm, paid.
  # shortcut: one instance, so the 60 s in-process caches (venues, sectors, sessions) can't go stale across instances.
  # Ceiling: ~80 concurrent requests. Upgrade: shared cache (lib/data.ts, lib/session.ts), then raise this.
  maxInstances: 1
env:
  - variable: APP_URL
    value: https://CHANGE-ME.hosted.app # replace with the URL App Hosting shows after the first rollout, then push
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: hallbooking-8de43
  - variable: B2_KEY_ID
    secret: B2_KEY_ID
  - variable: B2_APP_KEY
    secret: B2_APP_KEY
  - variable: B2_BUCKET_ID
    value: CHANGE-ME # same value as in your .env.local (not secret)
  - variable: B2_BUCKET_NAME
    value: CHANGE-ME # same value as in your .env.local
  - variable: GST_INVOICE_PREFIX
    value: HB
  # - variable: TRUST_GSTIN
  #   value: CHANGE-ME
