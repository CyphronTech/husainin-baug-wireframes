<body class="hb-screen">
<div style="min-height:820px;display:flex;align-items:center;justify-content:center;background:#F4F5F4;font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;padding:40px 0;box-sizing:border-box"><div style="width:100%;max-width:440px;display:flex;flex-direction:column;gap:20px;padding:0 16px;box-sizing:border-box">
<div style="text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center"><span style="width:64px;height:64px;border-radius:16px;background:#1F3B3A;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700">HB</span><h1 style="margin:0;font-size:26px;color:#1D2423">Husainin Baug</h1><p style="margin:0;font-size:15px;color:#4F5957">Hall &amp; Room Booking</p></div>
<form style="background:#FFFFFF;border:1px solid #D5DAD8;border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:16px">

<div style="display:flex;flex-direction:column;gap:6px"><label for="pwd" style="font-size:13px;font-weight:600;color:#4F5957">Password</label><input id="pwd" type="password" placeholder="Password" style="height:44px;padding:0 12px;border:1px solid #9AA5A3;border-radius:8px;font-size:15px;font-family:inherit;box-sizing:border-box;width:100%;color:#1D2423;background:#FFFFFF"></div>
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div style="display:flex;align-items:center;gap:8px"><input id="rem" type="checkbox" style="width:18px;height:18px"><label for="rem" style="font-size:14px;color:#1D2423">Remember me</label></div><a href="#forgot" style="font-size:14px;font-weight:600">Forgot password?</a></div>
<a href="Main.html" style="display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:8px;background:#1F5F5B;color:#FFFFFF;font-size:15px;font-weight:700;text-decoration:none">Sign in</a>
<div style="display:flex;align-items:center;gap:10px"><span style="flex:1;height:1px;background:#D5DAD8" aria-hidden="true"></span><span style="font-size:12px;color:#4F5957">or</span><span style="flex:1;height:1px;background:#D5DAD8" aria-hidden="true"></span></div>
<a href="#otp" style="display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:8px;background:#FFFFFF;color:#1D2423;border:1px solid #9AA5A3;font-size:14px;font-weight:600;text-decoration:none;text-align:center;padding:0 12px">Sign in with OTP on WhatsApp</a>
<p style="margin:0;font-size:13px;color:#4F5957;text-align:center">Accounts are created by Admin. There is no self sign-up.</p>
</form>
<div style="border:1px dashed #9AA5A3;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;background:#FFFFFF">
<p style="margin:0;font-size:13px;font-weight:700;color:#1D2423">Demo: choose a role</p>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px"><a href="Main.html" style="display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:8px;background:#FFFFFF;color:#1D2423;border:1px solid #9AA5A3;font-size:14px;font-weight:600;text-decoration:none;text-align:center;padding:0 12px">Husainin Baug Admin</a><a href="M1_Dashboard.html" style="display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:8px;background:#FFFFFF;color:#1D2423;border:1px solid #9AA5A3;font-size:14px;font-weight:600;text-decoration:none;text-align:center;padding:0 12px">BURHANI MOHALLA (POONA) user</a></div>
</div>
</div></div>
